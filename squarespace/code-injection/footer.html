<!-- ANDURIL · Settings → Advanced → Code Injection → FOOTER (Core plan or higher)
     Adds: the star sky · the day/night switch · the sheet frame · custom cursor · scroll reveals · counters · survey bars · contours · local clock · new-tab external links.
     Every effect degrades cleanly: without this script the site is fully usable. -->
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ease = 'cubic-bezier(.22,1,.36,1)';


  /* The star sky (turn off by deleting this block): a fixed field behind every sheet. Ivory stars with a slow twinkle by night, the same field printed
     faintly in pine by day. A meteor crosses now and then after dark. Positions are seeded so the sky is the same on
     every visit. */
  (function () {
    var c = document.createElement('canvas'); c.className = 'and-stars'; c.setAttribute('aria-hidden', 'true'); document.body.insertBefore(c, document.body.firstChild);
    var ctx = c.getContext('2d'), stars = [], W = 0, H = 0, dpr = 1, meteor = null, nextMeteor = 0;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function isDark() { var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
    var seed = 19; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    function make() {
      seed = 19; stars = []; var n = Math.round(Math.max(innerWidth * innerHeight / 5200, 120));
      for (var i = 0; i < n; i++) { var u = rnd(); stars.push({ x: rnd(), y: rnd(), r: 0.35 + u * u * 1.5, ph: rnd() * 6.283, sp: 0.25 + rnd() * .75, gilt: rnd() < 0.05 }); }
    }
    function size() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); make(); if (reduce) draw(0); }
    function draw(t) {
      var dark = isDark(), s = t / 1000; ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i], tw = reduce ? 1 : 0.6 + 0.4 * Math.sin(s * st.sp + st.ph);
        var a = dark ? (0.18 + 0.5 * tw) * Math.min(1, st.r / 1.1) : (0.08 + 0.1 * tw);
        var col = st.gilt ? '201,161,75' : (dark ? '244,239,228' : '20,61,49');
        var x = st.x * W, y = st.y * H;
        ctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, y, st.r, 0, 6.283); ctx.fill();
      }
      if (dark && !reduce) {
        if (!meteor && t > nextMeteor) { meteor = { x0: W * (0.15 + Math.random() * 0.7), y0: H * (0.05 + Math.random() * 0.3), t0: t, len: 140 + Math.random() * 120, dir: Math.random() < 0.5 ? 1 : -1 }; }
        if (meteor) {
          var p = (t - meteor.t0) / 900; if (p >= 1) { meteor = null; nextMeteor = t + 22000 + Math.random() * 30000; }
          else { var dx = meteor.dir * 0.86, dy = 0.5, x1 = meteor.x0 + dx * meteor.len * 2.2 * p, y1 = meteor.y0 + dy * meteor.len * 2.2 * p; var g = ctx.createLinearGradient(x1 - dx * meteor.len, y1 - dy * meteor.len, x1, y1); g.addColorStop(0, 'rgba(244,239,228,0)'); g.addColorStop(1, 'rgba(244,239,228,' + (0.8 * Math.sin(p * 3.1416)).toFixed(3) + ')'); ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x1 - dx * meteor.len, y1 - dy * meteor.len); ctx.lineTo(x1, y1); ctx.stroke(); }
        }
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    size(); window.addEventListener('resize', size); nextMeteor = 6000 + Math.random() * 12000;
    if (!reduce) requestAnimationFrame(draw);
    if (reduce) new MutationObserver(function () { draw(0); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();

  /* 0. Day and night: a sun and a moon in the header; the choice is remembered on this device when storage allows. */
  var rootEl = document.documentElement;
  try { var saved = localStorage.getItem('anduril-theme'); if (saved === 'dark' || saved === 'light') rootEl.setAttribute('data-theme', saved); } catch (e) {}
  var host = document.querySelector('.header-actions') || document.querySelector('.header-burger') || document.querySelector('.header-inner');
  if (host) {
    var tb = document.createElement('button'); tb.className = 'and-theme-btn'; tb.type = 'button'; tb.setAttribute('aria-label', 'Switch between day and night'); tb.title = 'Day / night';
    tb.innerHTML = '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2.5A9.5 9.5 0 1 0 21.5 13 8 8 0 0 1 14 2.5Z" fill="currentColor"/></svg>';
    host.insertBefore(tb, host.firstChild);
    tb.addEventListener('click', function () {
      var t = rootEl.getAttribute('data-theme'), dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = dark ? 'light' : 'dark'; rootEl.setAttribute('data-theme', next);
      try { localStorage.setItem('anduril-theme', next); } catch (e) {}
    });
  }

  /* 1. The sheet frame */
  var fr = document.createElement('div'); fr.className = 'and-sheet-frame'; fr.setAttribute('aria-hidden', 'true');
  fr.innerHTML = '<span class="v l"></span><span class="v r"></span><span class="coord">Sheet 01 · Anduril · Salesforce consultancy</span>';
  document.body.appendChild(fr);

  /* 2. Contours: the org as terrain, drawn into any <svg class="and-contours" data-seed="1.3" data-rings="9"> */
  function contours(seed, rings) {
    var out = '';
    for (var r = 1; r <= rings; r++) {
      var base = 22 + r * 22, d = '';
      for (var a = 0; a <= 360; a += 4) {
        var t = a * Math.PI / 180;
        var wob = Math.sin(t * 3 + seed) * 7 + Math.sin(t * 5 + seed * 1.7) * 4 + Math.cos(t * 2 + seed * .6) * 9 * (r / rings);
        var rr = base + wob, x = 200 + Math.cos(t) * rr, y = 200 + Math.sin(t) * rr * .86;
        d += (a === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      out += '<path d="' + d + 'Z" fill="none" stroke="currentColor" stroke-width="' + (r % 3 === 0 ? 1.1 : .6) + '" opacity="' + (.9 - r * .07).toFixed(2) + '"/>';
    }
    return out;
  }
  document.querySelectorAll('svg.and-contours').forEach(function (s) { if (!s.innerHTML.trim()) s.innerHTML = contours(parseFloat(s.dataset.seed || '1.3'), parseInt(s.dataset.rings || '9', 10)); });

  /* 3. Custom cursor: a sun by day, a moon by night */
  if (window.matchMedia('(pointer: fine)').matches && !reduce) {
    var cur = document.createElement('div'); cur.className = 'and-cursor'; cur.setAttribute('aria-hidden', 'true');
    cur.innerHTML = '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2.5A9.5 9.5 0 1 0 21.5 13 8 8 0 0 1 14 2.5Z" fill="currentColor"/></svg>'; document.body.appendChild(cur);
    var cx = -100, cy = -100, tx = -100, ty = -100;
    window.addEventListener('mousemove', function (e) { tx = e.clientX; ty = e.clientY; }, { passive: true });
    (function loop() { cx += (tx - cx) * .22; cy += (ty - cy) * .22; cur.style.transform = 'translate(' + (cx - 13) + 'px,' + (cy - 13) + 'px)'; requestAnimationFrame(loop); })();
    document.addEventListener('mouseover', function (e) { cur.classList.toggle('is-link', !!e.target.closest('a, button, summary, .and-svc')); });
  }

  /* 4. Scroll reveals */
  var vh = window.innerHeight;
  var targets = document.querySelectorAll('.sqs-block-html h1, .sqs-block-html h2, .sqs-block-html h3, .sqs-block-html p, .sqs-block-image, .sqs-block-quote, .and-ledger-row, .and-stage, .and-number, .and-case, .and-survey, .and-principles li, .and-rose-entry');
  if (!reduce && 'IntersectionObserver' in window) {
    var rvs = [];
    targets.forEach(function (el) { el.classList.add('and-rv'); if (el.getBoundingClientRect().top > vh * .92) { el.classList.add('pre'); rvs.push(el); } });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.remove('pre'); en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: .12 });
    rvs.forEach(function (el) { io.observe(el); });
    setTimeout(function () { rvs.forEach(function (el) { el.classList.remove('pre'); el.classList.add('in'); }); }, 3000);
  }

  /* 5. Counters (.and-count with data-to) and survey bars (.and-bar span with data-w) */
  if ('IntersectionObserver' in window && !reduce) {
    var cio = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return; var el = en.target; cio.unobserve(el);
        if (el.classList.contains('and-count')) {
          var to = parseInt(el.dataset.to, 10), t0 = null;
          (function step(ts) { if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / 1400), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(step); })(performance.now());
        } else {
          el.querySelectorAll('.and-bar span').forEach(function (b) { b.style.width = b.getAttribute('data-w'); });
        }
      });
    }, { threshold: .5 });
    document.querySelectorAll('.and-count').forEach(function (c) { cio.observe(c); });
    document.querySelectorAll('.and-survey').forEach(function (d) {
      d.querySelectorAll('.and-bar span').forEach(function (b) { b.style.transition = 'width 1.2s ' + ease; b.style.width = '0'; }); cio.observe(d);
    });
  }

  /* 6. Local clock in any element with class and-clock */
  var clocks = document.querySelectorAll('.and-clock');
  if (clocks.length) { var tick = function () { var s = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' local'; clocks.forEach(function (c) { c.textContent = s; }); }; tick(); setInterval(tick, 30000); }

  /* 7. External links open in a new tab */
  document.querySelectorAll('a[href^="http"]').forEach(function (a) { if (a.hostname !== location.hostname) { a.target = '_blank'; a.rel = 'noopener'; } });
})();
</script>
