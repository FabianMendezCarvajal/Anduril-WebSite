<!-- ANDURIL · Code Block: Chapter header. Type: HTML. Use one at the top of every numbered section, on dark or light.
     Edit three things per copy: the number, the label, and the heading. Wrap the words to set in serif italic in <i>…</i>.
     Optional lede: keep or delete the <p> line. -->
<style>
  .and-ch { display:grid; grid-template-columns:minmax(200px,1fr) minmax(0,3fr); gap:24px clamp(24px,4vw,64px); align-items:start; padding-top:26px; border-top:1px solid #1F232B; font-family:"IBM Plex Sans",Arial,sans-serif; color:#EDEBE6; }
  .and-ch.light { border-top-color:#D3D0C9; color:#0B0D11; }
  .and-ch .and-meta { display:flex; align-items:baseline; gap:14px; padding-top:10px; white-space:nowrap; font-family:"IBM Plex Mono",Menlo,monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#767C88; }
  .and-ch.light .and-meta { color:#7A7F8A; }
  .and-ch .and-num { font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-size:26px; line-height:1; letter-spacing:0; text-transform:none; color:#E0663A; }
  .and-ch .and-num::after { content:""; display:inline-block; width:28px; height:1px; background:currentColor; opacity:.5; vertical-align:.32em; margin-left:14px; }
  .and-ch .and-col { display:grid; gap:22px; }
  .and-ch h2 { font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; font-size:clamp(36px,5vw,78px); font-weight:500; letter-spacing:-.04em; line-height:.98; max-width:16ch; margin:-.08em 0 0; }
  .and-ch h2 i { font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-weight:400; letter-spacing:-.01em; }
  .and-ch p { font-size:clamp(17px,1.35vw,20px); color:#B4B6BC; max-width:52ch; line-height:1.5; margin:0; }
  .and-ch.light p { color:#454A55; }
  @media (max-width:760px) { .and-ch { grid-template-columns:1fr; gap:18px; } .and-ch .and-meta { padding-top:0; } .and-ch h2 { margin-top:0; } }
</style>
<div class="and-ch">
  <span class="and-meta"><span class="and-num">01</span>Sound familiar</span>
  <div class="and-col">
    <h2>Three ways an org tells you <i>it's time.</i></h2>
    <p>Optional lede. Delete this line if the section does not need one.</p>
  </div>
</div>
<!-- On a LIGHT section use: <div class="and-ch light"> -->
