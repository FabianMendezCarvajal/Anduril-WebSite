<!-- ANDURIL · Code Block: Chapter header. Type: HTML. One at the top of every numbered section, on ivory, vellum or pine.
     Edit the sheet number, the label and the heading; wrap the turn of phrase in <i>…</i>. Add class "pine" on a pine section. -->
<style>
  .and-ch { display:grid; grid-template-columns:minmax(200px,1fr) minmax(0,3fr); gap:24px clamp(24px,4vw,64px); align-items:start; padding-top:24px; border-top:1px solid var(--and-ink,#143D31); position:relative; font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif; color:var(--and-ink,#143D31); }
  .and-ch::before { content:""; position:absolute; left:0; right:0; top:-1px; height:5px; background:repeating-linear-gradient(90deg,var(--and-ink,#143D31) 0 1px,transparent 1px 40px); }
  .and-ch::after { content:""; position:absolute; left:50%; top:-6px; width:11px; height:11px; margin-left:-5.5px; background-color:var(--and-ground,#F4EFE4); background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M6 0Q6 6 12 6Q6 6 6 12Q6 6 0 6Q6 6 6 0Z' fill='%23C9A14B'/></svg>"); background-size:9px 9px; background-position:center; background-repeat:no-repeat; }
  .and-ch.pine::after { background-color:var(--and-pine,#143D31); }
  .and-ch.pine { border-top-color:#BFD0C6; color:#F4EFE4; } .and-ch.pine::before { background:repeating-linear-gradient(90deg,#BFD0C6 0 1px,transparent 1px 40px); }
  .and-ch .and-meta { display:flex; align-items:baseline; gap:14px; padding-top:10px; white-space:nowrap; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--and-label,#6E8A7D); }
  .and-ch.pine .and-meta { color:#7E9A8C; }
  .and-ch .and-sheet { font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-style:italic; font-weight:400; font-variation-settings:"opsz" 144,"SOFT" 30,"WONK" 1; font-size:24px; line-height:1; letter-spacing:0; text-transform:none; color:var(--and-accent-ink,#7A5D18); }
  .and-ch.pine .and-sheet { color:#C9A14B; }
  .and-ch .and-col { display:grid; gap:22px; }
  .and-ch h2 { font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-variation-settings:"opsz" 144,"SOFT" 30,"WONK" 0; font-size:clamp(34px,4.8vw,76px); font-weight:500; letter-spacing:-.025em; line-height:1; max-width:16ch; margin:-.06em 0 0; }
  .and-ch h2 i { font-style:italic; font-weight:400; font-variation-settings:"opsz" 144,"SOFT" 30,"WONK" 1; letter-spacing:-.01em; color:var(--and-accent-ink,#7A5D18); }
  .and-ch.pine h2 i { color:#C9A14B; }
  .and-ch p { font-size:clamp(17px,1.3vw,20px); color:var(--and-ink-2,#3F6D58); max-width:52ch; line-height:1.5; margin:0; }
  .and-ch.pine p { color:#7E9A8C; }
  @media (max-width:760px) { .and-ch { grid-template-columns:1fr; gap:16px; } .and-ch .and-meta { padding-top:0; } .and-ch h2 { margin-top:0; } }
</style>
<div class="and-ch">
  <span class="and-meta"><span class="and-sheet">02</span>Terrain</span>
  <div class="and-col">
    <h2>Three signs the ground <i>has shifted.</i></h2>
    <p>Optional lede. Delete this line if the section does not need one.</p>
  </div>
</div>
<!-- On a PINE section use: <div class="and-ch pine"> -->
