<!-- ANDURIL · Code Block: The celestial sheet, a working sky chart as the hero's background. Type: HTML.
     Needs JavaScript, so it runs on the Core plan or higher. On lower plans the block shows nothing; use the contours instead.
     Layout: the disc sits half off the right edge of the section, like a planisphere wheel in its sleeve. The rotate buttons
     turn the wheel: each press advances or rewinds the sky by one hour; "Now" returns to the present. Place this block in the
     hero section under the headline block; the caption and controls sit where the block is, the disc is positioned by CSS.
     The section must clip overflow (the Custom CSS does this for the first section of the home page).
     What it does: computes the sky above the site's coordinates right now (bright stars scaled by magnitude with rays on the
     brightest, a field of fainter stars, the Milky Way, the hour and declination grid, constellation names, the ecliptic with
     the twelve zodiac signs, Sun and Moon with the Moon's phase) and draws it as a night disc inside a calendar ring that marks
     today. It refreshes every thirty seconds. Edit the two data- attributes to set your own coordinates.
     Colours outside the disc follow the site theme (light or dark); the disc itself is always night. -->

  .and-sky-disc svg { width:100%; height:100%; display:block; overflow:visible; }

    [30, 60].forEach(function (a) { g.appendChild(el('circle', { cx: CX, cy: CY, r: RH * (90 - a) / 90, 'class': 'grid', 'stroke-dasharray': '1 3' })); });
    /* Ecliptic and zodiac */
    var ept = []; for (var L = 0; L <= 360; L += 3) ept.push(eclToEq(L, 0, eps)); curve(ept, 'ecl');
    for (var s = 0; s < 12; s++) {
      var mid = eclToEq(s * 30 + 15, 0, eps), ma = altaz(mid[0], mid[1]);
      if (ma[0] > 3) { var mp = proj(ma[0], ma[1]); g.appendChild(el('text', { x: mp[0], y: mp[1] + 3, 'text-anchor': 'middle', 'class': 'zg' }, SIGNS[s][1])); }
      var bd = eclToEq(s * 30, 0, eps), ba = altaz(bd[0], bd[1]);
      if (ba[0] > 0) { var bp = proj(ba[0], ba[1]); g.appendChild(el('circle', { cx: bp[0], cy: bp[1], r: 1.2, fill: '#C9A14B' })); }
    }
    /* Constellation names, kept clear of the named stars */
    var named = []; STARS.forEach(function (st) { if (st[3] < 1.3) { var aa = altaz(st[1], st[2]); if (aa[0] > 0) named.push(proj(aa[0], aa[1])); } });
    CONS.forEach(function (c) { var aa = altaz(c[1], c[2]); if (aa[0] < 6) return; var p = proj(aa[0], aa[1]); for (var n = 0; n < named.length; n++) { if (Math.abs(named[n][0] - p[0]) < 26 && Math.abs(named[n][1] - p[1]) < 9) return; } g.appendChild(el('text', { x: p[0], y: p[1], 'text-anchor': 'middle', 'class': 'con' }, c[0])); });
    /* Faint field */
    FAINT.forEach(function (st) { var aa = altaz(st[0], st[1]); if (aa[0] < 0) return; var p = proj(aa[0], aa[1]); g.appendChild(el('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: (0.9 - (st[2] - 2.8) * 0.16).toFixed(2), 'class': 'st f' })); });
    /* Bright stars, with rays on the brightest */
    STARS.forEach(function (st) {
      var aa = altaz(st[1], st[2]); if (aa[0] < 0) return;
      var p = proj(aa[0], aa[1]), r = Math.max(.8, 2.7 - st[3] * .8);
      if (st[3] < 1.0) { var rl = r + 4.5 + (1 - st[3]) * 2; for (var k = 0; k < 8; k++) { var an = k * 45 * D2R, inner = k % 2 ? r + .8 : r + .4, outer = k % 2 ? rl * .62 : rl; g.appendChild(el('line', { x1: p[0] + inner * Math.cos(an), y1: p[1] + inner * Math.sin(an), x2: p[0] + outer * Math.cos(an), y2: p[1] + outer * Math.sin(an), 'class': 'ray' })); } }
      g.appendChild(el('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: r.toFixed(2), 'class': 'st' + (st[3] < 0.5 ? ' b' : '') }));
      if (st[3] < 1.3) g.appendChild(el('text', { x: p[0] + r + 5, y: p[1] + 2.4, 'class': 'sn' }, st[0]));
    });
    /* Sun and Moon */
    var ls = sun(D), se = eclToEq(ls, 0, eps), sa = altaz(se[0], se[1]);
    var mo = moon(D), me = eclToEq(mo[0], mo[1], eps), mA = altaz(me[0], me[1]);
    var elong = norm(mo[0] - ls), illum = (1 - Math.cos(elong * D2R)) / 2, waxing = elong < 180;
    if (sa[0] > -1) { var sp = proj(Math.max(sa[0], 0), sa[1]); g.appendChild(el('circle', { cx: sp[0], cy: sp[1], r: 5, fill: '#C9A14B' })); for (var q = 0; q < 12; q++) { var ang = q * 30 * D2R; g.appendChild(el('line', { x1: sp[0] + 7 * Math.cos(ang), y1: sp[1] + 7 * Math.sin(ang), x2: sp[0] + (q % 2 ? 10 : 12) * Math.cos(ang), y2: sp[1] + (q % 2 ? 10 : 12) * Math.sin(ang), stroke: '#C9A14B', 'stroke-width': .9, 'stroke-linecap': 'round' })); } g.appendChild(el('text', { x: sp[0] + 15, y: sp[1] + 2.5, 'class': 'sm' }, 'SUN')); }
    if (mA[0] > -1) {
      var mp2 = proj(Math.max(mA[0], 0), mA[1]), rm = 5.5;
      g.appendChild(el('circle', { cx: mp2[0], cy: mp2[1], r: rm + 3, fill: '#F4EFE4', opacity: .12 }));
      g.appendChild(el('circle', { cx: mp2[0], cy: mp2[1], r: rm, fill: '#F4EFE4' }));
      var k2 = 2 * illum - 1, sweep = waxing ? 0 : 1; /* the dark limb */
      var path = 'M' + mp2[0] + ' ' + (mp2[1] - rm) + ' A' + rm + ' ' + rm + ' 0 0 ' + sweep + ' ' + mp2[0] + ' ' + (mp2[1] + rm) + ' A' + Math.abs(k2 * rm).toFixed(2) + ' ' + rm + ' 0 0 ' + ((k2 > 0) !== (sweep === 1) ? 1 : 0) + ' ' + mp2[0] + ' ' + (mp2[1] - rm) + ' Z';
      g.appendChild(el('path', { d: path, fill: '#0C2320', opacity: .92 }));
      g.appendChild(el('text', { x: mp2[0] + 10, y: mp2[1] + 2.5, 'class': 'sm' }, 'MOON'));
    }
    g = G;
    /* Cardinal points, the West lit */
    [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(function (c) {
      var p = proj(-8, c[1]); g.appendChild(el('text', { x: p[0], y: p[1] + 3, 'text-anchor': 'middle', 'class': 'card' + (c[0] === 'W' ? ' w' : '') }, c[0]));
      var q2 = proj(0, c[1]); g.appendChild(el('circle', { cx: q2[0], cy: q2[1], r: 1.8, fill: c[0] === 'W' ? '#C9A14B' : '#F4EFE4', stroke: '#143D31', 'stroke-width': .6 }));
    });
    /* Caption */
    var phaseName = illum < .03 ? 'new moon' : illum > .97 ? 'full moon' : (illum < .5 ? (waxing ? 'waxing crescent' : 'waning crescent') : (waxing ? 'waxing gibbous' : 'waning gibbous'));
    var sSign = SIGNS[Math.floor(ls / 30) % 12][0], mSign = SIGNS[Math.floor(mo[0] / 30) % 12][0];
    var latS = Math.abs(lat).toFixed(2) + '° ' + (lat >= 0 ? 'N' : 'S'), lonS = Math.abs(lon).toFixed(2) + '° ' + (lon >= 0 ? 'E' : 'W');
    offEl.textContent = tOff === 0 ? 'now' : (tOff > 0 ? '+' : '') + tOff + ' h';
    cap.innerHTML = '<span><b>' + now.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + '</b> · ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + (tOff === 0 ? ' local' : ' local, turned') + '</span>' +
      '<span>' + latS + ' · ' + lonS + '</span>' +
      '<span>Sun in <i>' + sSign + '</i>' + (sa[0] > 0 ? ' · above the horizon' : ' · below the horizon') + '</span>' +
      '<span>Moon in <i>' + mSign + '</i> · ' + phaseName + ' ' + Math.round(illum * 100) + '%</span>';
  }
  draw(); setInterval(draw, 30000);
  /* Turning the wheel: the disc spins the way the sky really moves at this latitude, then redraws at the new hour. */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function turn(hours) {
    if (spinning) return; spinning = true;
    var target = tOff + hours, deg = (lat >= 0 ? -15 : 15) * hours, t0 = null;
    if (reduce) { tOff = target; draw(); spinning = false; return; }
    (function step(ts) {
      if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - p, 3);
      g.style.transform = 'rotate(' + (deg * e) + 'deg)';
      if (p < 1) requestAnimationFrame(step); else { tOff = target; g.style.transform = ''; draw(); spinning = false; }
    })(performance.now());
  }
  document.getElementById('andSkyBack').addEventListener('click', function () { turn(-1); });
  document.getElementById('andSkyFwd').addEventListener('click', function () { turn(1); });
  document.getElementById('andSkyNow').addEventListener('click', function () { if (spinning) return; tOff = 0; draw(); });
  document.getElementById('andSkyLoc').addEventListener('submit', function (e) { e.preventDefault(); var a = parseFloat(latIn.value), b = parseFloat(lonIn.value); if (isFinite(a) && isFinite(b)) { lat = Math.max(-90, Math.min(90, a)); lon = Math.max(-180, Math.min(180, b)); draw(); } });
  document.getElementById('andSkyGeo').addEventListener('click', function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) { lat = pos.coords.latitude; lon = pos.coords.longitude; latIn.value = lat.toFixed(4); lonIn.value = lon.toFixed(4); draw(); }, function () {});
  });
})();
