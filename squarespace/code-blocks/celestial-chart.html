<!-- ANDURIL · Code Block: The celestial sheet, a working sky chart (home hero, right column). Type: HTML.
     Needs JavaScript, so it runs on the Core plan or higher. On lower plans the block shows the empty ring only; use the contours instead.
     What it does: computes the sky above the site's coordinates right now (bright stars, the ecliptic, the twelve
     zodiac signs, Sun and Moon with the Moon's phase) and draws it as a planisphere inside a calendar ring that marks
     today. It refreshes every thirty seconds. Edit the two data- attributes to set your own coordinates. -->
<style>
  .and-sky { --sky-pine:#143D31; --sky-moss:#3F6D58; --sky-sage:#6E8A7D; --sky-gilt:#C9A14B; --sky-gilt-deep:#7A5D18; --sky-rule:#D3CAB4; --sky-ivory:#F4EFE4; --sky-vellum:#E9E2D0;
    font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif; color:var(--sky-pine); display:grid; gap:14px; width:100%; max-width:560px; margin-inline:auto; }
  .and-sky svg { width:100%; height:auto; display:block; }
  .and-sky .and-sky-cap { display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--sky-sage); border-top:1px solid var(--sky-rule); padding-top:12px; }
  .and-sky .and-sky-cap b { color:var(--sky-pine); font-weight:500; }
  .and-sky .and-sky-cap i { font-family:"Fraunces",Georgia,serif; font-style:italic; font-variation-settings:"opsz" 144,"SOFT" 30,"WONK" 1; font-size:14px; letter-spacing:0; text-transform:none; color:var(--sky-gilt-deep); }
  .and-sky .and-sky-loc { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--sky-sage); }
  .and-sky .and-sky-loc input { font:inherit; width:7.5em; color:var(--sky-pine); background:none; border:0; border-bottom:1px solid var(--sky-rule); padding:4px 0; border-radius:0; }
  .and-sky .and-sky-loc input:focus { outline:none; border-bottom-color:var(--sky-gilt); }
  .and-sky .and-sky-loc button { font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--sky-pine); background:none; border:1px solid var(--sky-pine); border-radius:2px; padding:6px 10px; cursor:pointer; }
  .and-sky .and-sky-loc button:hover { background:var(--sky-gilt); border-color:var(--sky-gilt); }
  .and-sky .st { fill:var(--sky-pine); } .and-sky .st.b { fill:var(--sky-gilt-deep); }
  .and-sky .ring { fill:none; stroke:var(--sky-rule); stroke-width:.6; }
  .and-sky .hz { fill:var(--sky-ivory); stroke:var(--sky-pine); stroke-width:.9; }
  .and-sky .ecl { fill:none; stroke:var(--sky-gilt); stroke-width:.8; stroke-dasharray:2 3; }
  .and-sky text { font-family:"DM Mono",Menlo,Consolas,monospace; fill:var(--sky-sage); letter-spacing:.08em; }
  .and-sky text.card { font-size:9px; fill:var(--sky-pine); font-weight:500; } .and-sky text.card.w { fill:var(--sky-gilt-deep); }
  .and-sky text.mo { font-size:6.4px; text-transform:uppercase; } .and-sky text.mo.now { fill:var(--sky-gilt-deep); }
  .and-sky text.zg { font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Symbols","DejaVu Sans",sans-serif; font-size:8px; fill:var(--sky-gilt-deep); letter-spacing:0; }
  @media (max-width:520px) { .and-sky .and-sky-cap { grid-template-columns:1fr; } }
</style>
<div class="and-sky" id="andSky" data-lat="51.5074" data-lon="-0.1278">
  <svg viewBox="0 0 400 400" role="img" aria-label="Sky chart for the site's coordinates, right now"><g id="andSkyG"></g></svg>
  <div class="and-sky-cap" id="andSkyCap"></div>
  <form class="and-sky-loc" id="andSkyLoc"><label>Lat <input id="andSkyLat" type="number" step="0.0001" min="-90" max="90" aria-label="Latitude"></label><label>Lon <input id="andSkyLon" type="number" step="0.0001" min="-180" max="180" aria-label="Longitude"></label><button type="submit">Chart</button><button type="button" id="andSkyGeo">Use my location</button></form>
</div>
<script>
(function () {
  var root = document.getElementById('andSky'); if (!root) return;
  var g = document.getElementById('andSkyG'), cap = document.getElementById('andSkyCap');
  var latIn = document.getElementById('andSkyLat'), lonIn = document.getElementById('andSkyLon');
  var lat = parseFloat(root.dataset.lat), lon = parseFloat(root.dataset.lon);
  latIn.value = lat; lonIn.value = lon;
  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  /* Bright stars: name, RA (hours), Dec (degrees), magnitude. */
  var STARS = [['Sirius',6.752,-16.716,-1.46],['Canopus',6.399,-52.696,-0.74],['Arcturus',14.261,19.182,-0.05],['Rigil Kentaurus',14.660,-60.835,-0.27],['Vega',18.616,38.784,0.03],['Capella',5.278,45.998,0.08],['Rigel',5.242,-8.202,0.13],['Procyon',7.655,5.225,0.34],['Achernar',1.629,-57.237,0.46],['Betelgeuse',5.919,7.407,0.5],['Hadar',14.064,-60.373,0.61],['Altair',19.846,8.868,0.76],['Acrux',12.443,-63.099,0.76],['Aldebaran',4.599,16.509,0.86],['Antares',16.490,-26.432,0.96],['Spica',13.420,-11.161,0.97],['Pollux',7.755,28.026,1.14],['Fomalhaut',22.961,-29.622,1.16],['Deneb',20.690,45.280,1.25],['Mimosa',12.795,-59.689,1.25],['Regulus',10.140,11.967,1.35],['Adhara',6.977,-28.972,1.5],['Castor',7.577,31.888,1.58],['Gacrux',12.519,-57.113,1.63],['Shaula',17.560,-37.104,1.62],['Bellatrix',5.419,6.350,1.64],['Elnath',5.438,28.608,1.65],['Miaplacidus',9.220,-69.717,1.68],['Alnilam',5.604,-1.202,1.69],['Alnair',22.137,-46.961,1.74],['Alnitak',5.679,-1.943,1.77],['Alioth',12.900,55.960,1.77],['Dubhe',11.062,61.751,1.79],['Mirfak',3.405,49.861,1.8],['Wezen',7.140,-26.393,1.84],['Sargas',17.622,-42.998,1.87],['Kaus Australis',18.403,-34.385,1.85],['Avior',8.375,-59.510,1.86],['Alkaid',13.792,49.313,1.86],['Menkalinan',5.992,44.948,1.9],['Atria',16.811,-69.028,1.92],['Alhena',6.629,16.399,1.93],['Peacock',20.427,-56.735,1.94],['Alsephina',8.745,-54.709,1.96],['Mirzam',6.378,-17.956,1.98],['Alphard',9.460,-8.659,1.98],['Polaris',2.530,89.264,1.98],['Hamal',2.120,23.463,2.0],['Algieba',10.333,19.842,2.08],['Diphda',0.727,-17.987,2.02],['Mizar',13.399,54.925,2.04],['Nunki',18.921,-26.297,2.05],['Menkent',14.111,-36.370,2.06],['Mirach',1.162,35.621,2.05],['Alpheratz',0.140,29.091,2.06],['Rasalhague',17.582,12.560,2.08],['Kochab',14.845,74.156,2.08],['Saiph',5.796,-9.670,2.09],['Denebola',11.818,14.572,2.14],['Algol',3.136,40.956,2.12],['Tiaki',22.711,-46.885,2.11],['Muhlifain',12.692,-48.960,2.17],['Aspidiske',9.285,-59.275,2.21],['Suhail',9.133,-43.433,2.21],['Alphecca',15.578,26.715,2.23],['Mintaka',5.533,-0.299,2.23],['Sadr',20.370,40.257,2.23],['Eltanin',17.943,51.489,2.23],['Schedar',0.675,56.537,2.24],['Naos',8.060,-40.003,2.25],['Almach',2.065,42.330,2.26],['Caph',0.153,59.150,2.27],['Izar',14.750,27.074,2.37],['Dschubba',16.006,-22.622,2.32],['Larawag',16.836,-34.293,2.29],['Merak',11.031,56.382,2.37],['Ankaa',0.438,-42.306,2.38],['Enif',21.736,9.875,2.39],['Scheat',23.063,28.083,2.42],['Sabik',17.173,-15.725,2.43],['Phecda',11.897,53.695,2.44],['Aludra',7.402,-29.303,2.45],['Markab',23.079,15.205,2.48],['Alderamin',21.309,62.585,2.44],['Gienah',12.263,-17.542,2.59],['Zubeneschamali',15.283,-9.383,2.61],['Unukalhai',15.738,6.426,2.63],['Sheratan',1.911,20.808,2.64],['Menkar',3.038,4.090,2.53],['Zosma',11.235,20.524,2.56],['Arneb',5.545,-17.822,2.58]];
  var SIGNS = [['Aries','♈'],['Taurus','♉'],['Gemini','♊'],['Cancer','♋'],['Leo','♌'],['Virgo','♍'],['Libra','♎'],['Scorpio','♏'],['Sagittarius','♐'],['Capricorn','♑'],['Aquarius','♒'],['Pisces','♓']];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function norm(x) { x = x % 360; return x < 0 ? x + 360 : x; }
  function jd(d) { return d.getTime() / 86400000 + 2440587.5; }
  function eclToEq(lam, bet, eps) {
    var l = lam * D2R, b = bet * D2R, e = eps * D2R;
    var ra = Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)) * R2D / 15;
    var dec = Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)) * R2D;
    return [ra < 0 ? ra + 24 : ra, dec];
  }
  function sun(D) { var L = norm(280.460 + 0.9856474 * D), gm = norm(357.528 + 0.9856003 * D) * D2R; return norm(L + 1.915 * Math.sin(gm) + 0.020 * Math.sin(2 * gm)); }
  function moon(D) {
    var T = D / 36525, s = function (a, b) { return Math.sin((a * T + b) * D2R); };
    var lam = norm(218.32 + 481267.881 * T + 6.29 * s(477198.87, 135.0) - 1.27 * s(413335.36, 259.3) + 0.66 * s(890534.22, 235.7) + 0.21 * s(954397.74, 269.9) - 0.19 * s(35999.05, 357.5) - 0.11 * s(966404.03, 186.5));
    var bet = 5.13 * s(483202.02, 93.3) + 0.28 * s(960400.89, 228.2) - 0.28 * s(6003.15, 318.3) - 0.17 * s(407332.21, 217.6);
    return [lam, bet];
  }
  function altaz(raH, dec, lst) {
    var H = (lst * 15 - raH * 15) * D2R, d = dec * D2R, p = lat * D2R;
    var alt = Math.asin(Math.sin(d) * Math.sin(p) + Math.cos(d) * Math.cos(p) * Math.cos(H));
    var az = Math.atan2(-Math.cos(d) * Math.sin(H), Math.sin(d) * Math.cos(p) - Math.cos(d) * Math.sin(p) * Math.cos(H));
    return [alt * R2D, norm(az * R2D)];
  }
  var CX = 200, CY = 200, RH = 146; /* horizon radius */
  function proj(alt, az) { var r = RH * (90 - alt) / 90, a = az * D2R; return [CX - r * Math.sin(a), CY - r * Math.cos(a)]; } /* looking up: east on the left */
  function el(n, a, t) { var e = document.createElementNS('http://www.w3.org/2000/svg', n); for (var k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; }
  function draw() {
    var now = new Date(), D = jd(now) - 2451545.0;
    var gmst = (18.697374558 + 24.06570982441908 * D) % 24, lst = ((gmst + lon / 15) % 24 + 24) % 24;
    var eps = 23.439 - 0.0000004 * D;
    while (g.firstChild) g.removeChild(g.firstChild);
    /* Calendar ring: the year, with today marked */
    g.appendChild(el('circle', { cx: CX, cy: CY, r: 194, 'class': 'ring' }));
    g.appendChild(el('circle', { cx: CX, cy: CY, r: 172, 'class': 'ring' }));
    var y0 = new Date(now.getFullYear(), 0, 1), y1 = new Date(now.getFullYear() + 1, 0, 1), yfrac = (now - y0) / (y1 - y0);
    for (var m = 0; m < 12; m++) {
      var f0 = (new Date(now.getFullYear(), m, 1) - y0) / (y1 - y0), a0 = f0 * 360 * D2R;
      g.appendChild(el('line', { x1: CX + 172 * Math.sin(a0), y1: CY - 172 * Math.cos(a0), x2: CX + 194 * Math.sin(a0), y2: CY - 194 * Math.cos(a0), stroke: '#D3CAB4', 'stroke-width': .6 }));
      var f1 = (new Date(now.getFullYear(), m, 16) - y0) / (y1 - y0), am = f1 * 360, ar = am * D2R;
      var t = el('text', { x: CX + 183 * Math.sin(ar), y: CY - 183 * Math.cos(ar) + 2.2, 'text-anchor': 'middle', 'class': 'mo' + (m === now.getMonth() ? ' now' : ''), transform: 'rotate(' + am + ' ' + (CX + 183 * Math.sin(ar)) + ' ' + (CY - 183 * Math.cos(ar)) + ')' }, MONTHS[m]);
      g.appendChild(t);
    }
    var ta = yfrac * 360 * D2R;
    g.appendChild(el('path', { d: 'M' + (CX + 172 * Math.sin(ta)) + ' ' + (CY - 172 * Math.cos(ta)) + ' l' + (-4 * Math.cos(ta) + 8 * Math.sin(ta)) + ' ' + (-4 * Math.sin(ta) - 8 * Math.cos(ta)) + ' l' + (8 * Math.cos(ta)) + ' ' + (8 * Math.sin(ta)) + ' Z', fill: '#C9A14B' }));
    /* Horizon disc and altitude rings */
    g.appendChild(el('circle', { cx: CX, cy: CY, r: RH, 'class': 'hz' }));
    [30, 60].forEach(function (a) { g.appendChild(el('circle', { cx: CX, cy: CY, r: RH * (90 - a) / 90, 'class': 'ring' })); });
    g.appendChild(el('line', { x1: CX - RH, y1: CY, x2: CX + RH, y2: CY, stroke: '#D3CAB4', 'stroke-width': .5, 'stroke-dasharray': '1 2' }));
    g.appendChild(el('line', { x1: CX, y1: CY - RH, x2: CX, y2: CY + RH, stroke: '#D3CAB4', 'stroke-width': .5, 'stroke-dasharray': '1 2' }));
    /* Ecliptic and zodiac */
    var d = '', on = false;
    for (var L = 0; L <= 360; L += 3) {
      var eq = eclToEq(L, 0, eps), aa = altaz(eq[0], eq[1], lst);
      if (aa[0] > 0) { var p = proj(aa[0], aa[1]); d += (on ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); on = true; } else on = false;
    }
    if (d) g.appendChild(el('path', { d: d, 'class': 'ecl' }));
    for (var s = 0; s < 12; s++) {
      var mid = eclToEq(s * 30 + 15, 0, eps), ma = altaz(mid[0], mid[1], lst);
      if (ma[0] > 4) { var mp = proj(ma[0], ma[1]); g.appendChild(el('text', { x: mp[0], y: mp[1] + 3, 'text-anchor': 'middle', 'class': 'zg' }, SIGNS[s][1])); }
      var bd = eclToEq(s * 30, 0, eps), ba = altaz(bd[0], bd[1], lst);
      if (ba[0] > 0) { var bp = proj(ba[0], ba[1]); g.appendChild(el('circle', { cx: bp[0], cy: bp[1], r: 1.2, fill: '#C9A14B' })); }
    }
    /* Stars */
    STARS.forEach(function (st) {
      var aa = altaz(st[1], st[2], lst); if (aa[0] < 0) return;
      var p = proj(aa[0], aa[1]), r = Math.max(.7, 2.6 - st[3] * .75);
      g.appendChild(el('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: r.toFixed(2), 'class': 'st' + (st[3] < 0.5 ? ' b' : '') }));
      if (st[3] < 0.6) g.appendChild(el('text', { x: p[0] + r + 2, y: p[1] + 2.5, 'font-size': 6 }, st[0]));
    });
    /* Sun and Moon */
    var ls = sun(D), se = eclToEq(ls, 0, eps), sa = altaz(se[0], se[1], lst);
    var mo = moon(D), me = eclToEq(mo[0], mo[1], eps), mA = altaz(me[0], me[1], lst);
    var elong = norm(mo[0] - ls), illum = (1 - Math.cos(elong * D2R)) / 2, waxing = elong < 180;
    if (sa[0] > -1) { var sp = proj(Math.max(sa[0], 0), sa[1]); g.appendChild(el('circle', { cx: sp[0], cy: sp[1], r: 5, fill: '#C9A14B' })); for (var k = 0; k < 8; k++) { var ang = k * 45 * D2R; g.appendChild(el('line', { x1: sp[0] + 7 * Math.cos(ang), y1: sp[1] + 7 * Math.sin(ang), x2: sp[0] + 10 * Math.cos(ang), y2: sp[1] + 10 * Math.sin(ang), stroke: '#C9A14B', 'stroke-width': .9, 'stroke-linecap': 'round' })); } g.appendChild(el('text', { x: sp[0] + 13, y: sp[1] + 2.5, 'font-size': 6.5, fill: '#7A5D18' }, 'SUN')); }
    if (mA[0] > -1) {
      var mp2 = proj(Math.max(mA[0], 0), mA[1]), rm = 5.5;
      g.appendChild(el('circle', { cx: mp2[0], cy: mp2[1], r: rm, fill: '#F4EFE4', stroke: '#143D31', 'stroke-width': .8 }));
      /* phase: lit portion drawn as two half-ellipses */
      var k2 = 2 * illum - 1, sweep = waxing ? 1 : 0;
      var path = 'M' + mp2[0] + ' ' + (mp2[1] - rm) + ' A' + rm + ' ' + rm + ' 0 0 ' + sweep + ' ' + mp2[0] + ' ' + (mp2[1] + rm) + ' A' + Math.abs(k2 * rm).toFixed(2) + ' ' + rm + ' 0 0 ' + ((k2 > 0) === (sweep === 1) ? 1 : 0) + ' ' + mp2[0] + ' ' + (mp2[1] - rm) + ' Z';
      g.appendChild(el('path', { d: path, fill: '#143D31' }));
      g.appendChild(el('text', { x: mp2[0] + 9, y: mp2[1] + 2.5, 'font-size': 6.5 }, 'MOON'));
    }
    /* Cardinal points, the West lit */
    [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(function (c) {
      var p = proj(-7, c[1]); g.appendChild(el('text', { x: p[0], y: p[1] + 3, 'text-anchor': 'middle', 'class': 'card' + (c[0] === 'W' ? ' w' : '') }, c[0]));
      var q = proj(0, c[1]); g.appendChild(el('circle', { cx: q[0], cy: q[1], r: 1.6, fill: c[0] === 'W' ? '#C9A14B' : '#143D31' }));
    });
    /* Caption */
    var phaseName = illum < .03 ? 'new moon' : illum > .97 ? 'full moon' : (illum < .5 ? (waxing ? 'waxing crescent' : 'waning crescent') : (waxing ? 'waxing gibbous' : 'waning gibbous'));
    var sSign = SIGNS[Math.floor(ls / 30) % 12][0], mSign = SIGNS[Math.floor(mo[0] / 30) % 12][0];
    var latS = Math.abs(lat).toFixed(2) + '° ' + (lat >= 0 ? 'N' : 'S'), lonS = Math.abs(lon).toFixed(2) + '° ' + (lon >= 0 ? 'E' : 'W');
    cap.innerHTML = '<span><b>' + now.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + '</b> · ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' local</span>' +
      '<span>' + latS + ' · ' + lonS + '</span>' +
      '<span>Sun in <i>' + sSign + '</i>' + (sa[0] > 0 ? ' · above the horizon' : ' · below the horizon') + '</span>' +
      '<span>Moon in <i>' + mSign + '</i> · ' + phaseName + ' ' + Math.round(illum * 100) + '%</span>';
  }
  draw(); setInterval(draw, 30000);
  document.getElementById('andSkyLoc').addEventListener('submit', function (e) { e.preventDefault(); var a = parseFloat(latIn.value), b = parseFloat(lonIn.value); if (isFinite(a) && isFinite(b)) { lat = Math.max(-90, Math.min(90, a)); lon = Math.max(-180, Math.min(180, b)); draw(); } });
  document.getElementById('andSkyGeo').addEventListener('click', function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) { lat = pos.coords.latitude; lon = pos.coords.longitude; latIn.value = lat.toFixed(4); lonIn.value = lon.toFixed(4); draw(); }, function () {});
  });
})();
</script>
