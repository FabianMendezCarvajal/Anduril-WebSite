<!-- ANDURIL · Code Block: Charted, the clients (home sheet 06, About page). Type: HTML. IVORY section.
     6 clients: FIFA World Cup 26, Disney, Aeroméxico, IDB Group, Colsubsidio, Servicio Público de Empleo. The logos are embedded, so the block works as pasted.
     The logos are their one-colour white versions, on a pine panel in both day and night so they always read.
     Three columns on desktop, two on tablets, one on phones. Each logo's width is set by --w (pixels at desktop), chosen so
     the six read at the same visual weight: start from √(21000 × width ÷ height), then go about 10% smaller for a heavy wide
     wordmark and 10–20% larger for a thin or airy mark. width/height on the img only need the right proportions.
     To add a client: copy a cell, upload the client's white logo under Design → Custom CSS → Manage Custom Files, use its URL
     as the img src and set --w as above. Keep the count a multiple of 6 (or add an empty <div class="and-client"></div>)
     so the grid has no hole.
     Source files: assets/clients/. -->
<style>
  .and-clients { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:#33564A; border-radius:3px; overflow:hidden; --k:1px; font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif; }
  .and-client { min-height:clamp(220px,21vw,300px); display:grid; place-items:center; padding:36px 28px 60px; position:relative; background:#143D31; transition:background-color .35s; }
  .and-client:hover { background:#184637; }
  .and-client img { display:block; width:calc(var(--w) * var(--k)); max-width:100%; height:auto; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .and-client:hover img { transform:translateY(-4px); }
  .and-client .and-tag { position:absolute; left:20px; right:20px; bottom:18px; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:10px; line-height:1.5; letter-spacing:.14em; text-transform:uppercase; color:rgba(244,239,228,.6); }
  @media (max-width:1100px) { .and-clients { --k:.86px; } }
  @media (max-width:900px) { .and-clients { grid-template-columns:repeat(2,minmax(0,1fr)); --k:.8px; } }
  @media (max-width:560px) { .and-clients { grid-template-columns:1fr; } .and-client { min-height:190px; padding:30px 18px 54px; } }
</style>
