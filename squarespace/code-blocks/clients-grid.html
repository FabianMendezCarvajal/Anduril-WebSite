<!-- ANDURIL · Code Block: Charted, the clients (home sheet 06, About page). Type: HTML. IVORY section.
     Two clients: FIFA World Cup 26 and Colsubsidio. The logos are embedded, so the block works as pasted.
     Logos keep their own colours (both brands forbid recolouring); at night they sit on an ivory label.
     To add a client: copy a cell, upload the logo under Design → Custom CSS → Manage Custom Files, and use its URL as the img src
     (class "tall" for upright marks, "wide" for wordmarks). With four or more clients, change the grid to repeat(4,…).
     Source files: assets/clients/. -->
<style>
  .and-clients { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid var(--and-line,#D3CAB4); border-radius:3px; overflow:hidden; font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif; }
  .and-client { min-height:clamp(240px,26vw,340px); display:grid; place-items:center; padding:40px 28px 64px; position:relative; transition:background-color .35s; }
  .and-client + .and-client { border-left:1px solid var(--and-line,#D3CAB4); }
  .and-client:hover { background:var(--and-panel,#E9E2D0); }
  .and-client .and-plate { display:grid; place-items:center; padding:16px 22px; border-radius:2px; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .and-client:hover .and-plate { transform:translateY(-4px); }
  .and-client img { display:block; }
  .and-client img.tall { height:clamp(130px,13vw,180px); width:auto; }
  .and-client img.wide { width:clamp(200px,24vw,320px); max-width:100%; height:auto; }
  .and-client .and-tag { position:absolute; left:20px; bottom:18px; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--and-label,#6E8A7D); }
  :root[data-theme="dark"] .and-client .and-plate { background:#F4EFE4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .and-client .and-plate { background:#F4EFE4; } }
  @media (max-width:700px) { .and-clients { grid-template-columns:1fr; } .and-client + .and-client { border-left:0; border-top:1px solid var(--and-line,#D3CAB4); } .and-client { min-height:220px; padding:32px 18px 56px; } }
</style>
