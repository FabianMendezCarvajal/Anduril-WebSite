<!-- ANDURIL · Code Block: Charted, the clients (home sheet 06, About page). Type: HTML. IVORY section.
     Two clients: FIFA World Cup 26 and Colsubsidio. The logos are embedded, so the block works as pasted.
     The logos are their one-colour white versions, on a pine panel in both day and night so they always read.
     To add a client: copy a cell, upload the client's white logo under Design → Custom CSS → Manage Custom Files, and use its URL as the img src
     (class "tall" for upright marks, "wide" for wordmarks). With four or more clients, change the grid to repeat(4,…).
     Source files: assets/clients/. -->
<style>
  .and-clients { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); background:#143D31; border-radius:3px; overflow:hidden; font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif; }
  .and-client { min-height:clamp(240px,26vw,340px); display:grid; place-items:center; padding:40px 28px 64px; position:relative; transition:background-color .35s; }
  .and-client + .and-client { border-left:1px solid rgba(244,239,228,.14); }
  .and-client:hover { background:#184637; }
  .and-client img { display:block; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .and-client:hover img { transform:translateY(-4px); }
  .and-client img.tall { height:clamp(130px,13vw,180px); width:auto; }
  .and-client img.wide { width:clamp(200px,24vw,320px); max-width:100%; height:auto; }
  .and-client .and-tag { position:absolute; left:20px; bottom:18px; font-family:"DM Mono",Menlo,Consolas,monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(244,239,228,.6); }
  @media (max-width:700px) { .and-clients { grid-template-columns:1fr; } .and-client + .and-client { border-left:0; border-top:1px solid rgba(244,239,228,.14); } .and-client { min-height:220px; padding:32px 18px 56px; } }
</style>
